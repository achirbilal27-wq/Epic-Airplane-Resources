<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#081629" />
    <meta name="description" content="Explore skies, collect aircraft, and complete flight missions." />
    <title>Epic Airplane — Sky Frontier</title>
  </head>
  <body>
    <div id="app">
      <canvas id="renderCanvas" aria-label="3D airplane game"></canvas>
      <div class="hud">
        <header class="topbar">
          <div><span class="eyebrow">SKY FRONTIER</span><h1>Epic Airplane</h1></div>
          <div class="mission"><span>MISSION 01</span><strong>Island Recon</strong></div>
        </header>
        <section class="stats" aria-label="Flight status">
          <div><small>ALTITUDE</small><strong id="altitude">320 m</strong></div>
          <div><small>SPEED</small><strong id="speed">145 km/h</strong></div>
          <div><small>FLIGHT DATA</small><strong id="distance">0.0 km</strong></div>
        </section>
        <div class="hint" id="hint">Drag to steer · W/S or ↑/↓ to climb and dive</div>
        <div class="controls">
          <button id="leftBtn" aria-label="Steer left">◀</button>
          <button id="boostBtn" aria-label="Boost flight">BOOST</button>
          <button id="rightBtn" aria-label="Steer right">▶</button>
        </div>
        <div class="toast" id="toast" role="status">Welcome pilot — follow the route rings.</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
