name: Build Babylon.js prototype
on:
  push:
    branches: [babylon-prototype]
    paths:
      - "babylon-game/**"
      - ".github/workflows/babylon-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: babylon-game
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: babylon-game/package.json
      - name: Install dependencies
        run: npm install
      - name: Build production web app
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: epic-airplane-babylon-web
          path: babylon-game/dist/
          if-no-files-found: error
