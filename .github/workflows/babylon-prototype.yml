name: Build Babylon.js prototype
on:
  push:
    branches: [babylon-prototype]
    paths:
      - "babylon-game/**"
      - ".github/workflows/babylon-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: babylon-game
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: babylon-game/package.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install
      - name: Build production web app
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: epic-airplane-babylon-web
          path: babylon-game/dist/
          if-no-files-found: error
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Sync web assets into Android project
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: epic-airplane-babylon-debug-apk
          path: babylon-game/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
