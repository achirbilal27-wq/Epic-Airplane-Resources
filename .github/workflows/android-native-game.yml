name: Epic Airplane Android Build

on:
  push:
    paths:
      - 'native-game/**'
      - '.github/workflows/android-native-game.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epic-airplane-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and assemble APK
        run: gradle --no-daemon -p native-game testDebugUnitTest assembleDebug

      - name: Verify APK exists
        run: test -s native-game/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: epic-airplane-debug-apk
          path: native-game/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="native-game/app/build/outputs/apk/debug/app-debug.apk"
          NOTES="Latest native flight build from commit ${GITHUB_SHA}. All eight stages are free and unlocked."
          if gh release view native-latest >/dev/null 2>&1; then
            gh release upload native-latest "$APK" --clobber
            gh release edit native-latest --title "Epic Airplane — Latest Native APK" --notes "$NOTES"
          else
            gh release create native-latest "$APK" \
              --title "Epic Airplane — Latest Native APK" \
              --notes "$NOTES" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
